
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}
</style>
</head>

<body>

<video
    controls
    playsinline
    preload="metadata"
>
    <source src="https://cdn.videy.co/ceSxHneI1.mp4" type="video/mp4">
    Browser tidak mendukung pemutar video.
</video>

</body>
</html>
