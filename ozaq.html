
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    font-family: Arial, sans-serif;
}

.player-container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
}

.player-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}
</style>
</head>

<body>

<div class="player-container">
    <iframe
        src="https://videy.co/v?id=VVsl9SPW1"
        allowfullscreen
        allow="autoplay; fullscreen"
        scrolling="no">
    </iframe>
</div>

</body>
</html>
