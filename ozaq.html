
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.player {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
}
</style>
</head>

<body>

<div class="player">
    <video
        id="video"
        controls
        playsinline
        preload="auto"
    >
        <source
            src="https://cdn.slicedrv.com/V936179w1.mp4"
            type="video/mp4">
    </video>
</div>

</body>
</html>
