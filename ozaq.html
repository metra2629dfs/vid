```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#playerWrap {
    width: 100%;
    height: 100%;
    background: #000;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
}

video::-webkit-media-controls-panel {
    background-color: rgba(0,0,0,0.8);
}
</style>
</head>

<body>

<div id="playerWrap">

    <video controls playsinline preload="metadata">
        <source src="https://cdn.slicedrv.com/K8EFBQJq1.mp4" type="video/mp4">
        Browser tidak mendukung pemutar video.
    </video>

</div>

</body>
</html>
